<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Библиотекарь</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>📚 Моя Библиотека</h1>
            <p>Трекер чтения и статистика</p>
        </header>

        <!-- Панель статистики -->
        <section class="stats-panel">
            <div class="stat-card">
                <span class="stat-value" id="stat-books">0</span>
                <span class="stat-label">Книг прочитано</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-pages">0</span>
                <span class="stat-label">Страниц прочитано</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-avg">0.0</span>
                <span class="stat-label">Средний рейтинг</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="stat-days">0</span>
                <span class="stat-label">Дней чтения</span>
            </div>
        </section>

        <!-- Панель фильтров -->
        <section class="filters-panel">
            <input type="text" id="search-input" placeholder="Поиск по названию или автору...">
            <select id="genre-filter">
                <option value="">Все жанры</option>
            </select>
            <select id="status-filter">
                <option value="">Все статусы</option>
                <option value="Прочитано">Прочитано</option>
                <option value="Читаю">Читаю</option>
                <option value="В планах">В планах</option>
            </select>
        </section>

        <!-- Таблица -->
        <section class="table-container">
            <table id="books-table">
                <thead>
                    <tr>
                        <th>ФИО Автора</th>
                        <th>Название книги</th>
                        <th>Серия</th>
                        <th>Страницы</th>
                        <th>Резюме</th>
                        <th>Оценка</th>
                        <th>Сюжет</th>
                        <th>Статистика (дней)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Строки будут добавлены JS -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
